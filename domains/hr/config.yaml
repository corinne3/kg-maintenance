# =====================================================================
# Domain: HR — skills, roles, projects and certifications
# Sources:
#   - ESCO v1.2.1 (European Commission), classification, English + French
#     download: https://esco.ec.europa.eu/en/use-esco/download  -> data/esco/{en,fr}/
#   - A SYNTHETIC company ("Fictional Aero Co."), generated by domains/hr/generate.py.
#     No real person. Every synthetic file carries synthetic=True.
#
# Same kgcore/ as the maintenance domain. What this domain adds:
# long chains between people, human hubs, sensitive data, change over time,
# and a bridge to the maintenance graph through part types.
# =====================================================================

name: hr
description: "Skills graph of a fictional aerospace company, linked to the ESCO taxonomy"
seed: 42

esco:
  dir: data/esco
  languages: [en, fr]

# Occupations used by the fictional company (ESCO preferred labels, English).
# count = number of synthetic employees per occupation.
occupations:
  aircraft maintenance technician: 40
  aircraft maintenance engineer: 16
  aircraft engine specialist: 8
  quality engineer: 12
  mechanical engineer: 16
  software developer: 20
  data scientist: 8
  data engineer: 8
  project manager: 12
  human resources officer: 8
  human resources manager: 4
  financial controller: 8
  operations manager: 1

sites:
  Toulouse: {language: fr, share: 0.6}
  Bristol: {language: en, share: 0.4}

# Job titles that exist only in the company's HR system (not in ESCO), per occupation.
company_titles:
  aircraft maintenance technician: {fr: ["Tech. maintenance aéro", "Mécano avion"], en: ["Licensed B1 Engineer", "Aircraft Tech"]}
  aircraft maintenance engineer: {fr: ["Ingénieur Méthodes MRO"], en: ["MRO Engineer"]}
  quality engineer: {fr: ["Ing. qualité"], en: ["QA Lead"]}
  software developer: {fr: ["Dev Full Stack"], en: ["Full Stack Dev"]}
  data scientist: {fr: ["Tech Lead Data", "Product Owner IA"], en: ["Data Lead", "AI Product Owner"]}
  data engineer: {fr: ["Ingé Data"], en: ["Data Platform Engineer"]}
  project manager: {fr: ["Chef de projet SI"], en: ["MRO Planner"]}
  human resources officer: {fr: ["HRBP", "Responsable RH"], en: ["HRBP"]}
  human resources manager: {fr: ["DRH adjointe"], en: ["Head of People"]}
company_title_rate: 0.15
alt_label_rate: 0.35

# What people really type in a "skills" box.
vague_skills:
  fr: ["informatique", "relationnel", "travail en équipe", "Excel", "rigueur", "communication", "autonomie"]
  en: ["IT", "people skills", "teamwork", "Excel", "communication", "attention to detail", "self-starter"]
skills_per_employee: 6
vague_per_employee: 2

projects: 30
project_size: [4, 7]
hub_projects: 25          # the operations manager sits on this many projects

# Bridge to the maintenance domain: Part-66 type ratings and part types.
certifications:
  occupations: [aircraft maintenance technician, aircraft maintenance engineer, aircraft engine specialist]
  type_ratings: {Toulouse: [A320, A321, A319], Bristol: [737, A320]}
  part_types: [ENGINE_DRIVEN_PUMP, ELECTRIC_MOTOR_PUMP, POWER_TRANSFER_UNIT, HYDRAULIC_LINE, RESERVOIR, ACCUMULATOR]
  expired_rate: 0.15
  today: "2026-11-06"

# Sensitive attributes (synthetic): only HR may see them.
salary_bands: {aircraft maintenance technician: B2, aircraft maintenance engineer: B3, aircraft engine specialist: B3,
               quality engineer: B3, mechanical engineer: B3, software developer: B3, data scientist: B4,
               data engineer: B3, project manager: B4, human resources officer: B3, human resources manager: B5,
               financial controller: B4, operations manager: B6}
long_absence_rate: 0.05

# Reorganisation: on this date, half of the Toulouse software team moves to a new manager.
reorg:
  date: "2026-07-01"
  occupation: software developer
  site: Toulouse

# Access roles used for the access-control demo.
roles:
  employee: [HOLDS_OCCUPATION, HAS_SKILL, MEMBER_OF, WORKS_AT, REPORTS_TO, CERTIFIED_FOR, TYPE_RATED]
  manager: [HOLDS_OCCUPATION, HAS_SKILL, MEMBER_OF, WORKS_AT, REPORTS_TO, CERTIFIED_FOR, TYPE_RATED, HAS_LONG_ABSENCE]
  hr: [HOLDS_OCCUPATION, HAS_SKILL, MEMBER_OF, WORKS_AT, REPORTS_TO, CERTIFIED_FOR, TYPE_RATED, HAS_LONG_ABSENCE, IN_SALARY_BAND]
k_anonymity: 5
