# =====================================================================
# Domain: aircraft maintenance — ATA chapter 29 (hydraulic power)
# Source: FAA Service Difficulty Reports (SDR), 2025
#
# Everything specific to the domain lives here. The kgcore/ code is
# generic: another domain = another folder with its own config.yaml.
# Choices marked [D1], [D2]... are explained in DECISIONS.md.
# =====================================================================

name: maintenance_aviation
description: "Hydraulic incident reports (ATA 29) filed with the FAA in 2025"

source:
  file: data/SDR-2025.csv
  encoding: latin1
  id_column: OperatorControlNumber
  text_column: Discrepancy
  date_column: DifficultyDate

# [D1] Scope: ATA chapter 29 (JASC codes 29xx)
filter:
  column: JASCCode
  startswith: "29"

# ---------------------------------------------------------------------
# Ontology: node types and relations
# ---------------------------------------------------------------------
ontology:
  node_types:
    Report:        "One incident report (one row of the FAA file)"
    Aircraft:      "One aircraft (registration number)"
    AircraftModel: "Aircraft family (A320, 737...)"
    Manufacturer:  "Manufacturer"
    Operator:      "Airline or repair station that files the report"
    JascCode:      "FAA classification code (close to ATA chapters)"
    PartType:      "Normalised part type [D2]"
    Condition:     "Condition found (LEAKING, CRACKED...)"
    AmmTask:       "Maintenance manual task cited in the text"
  relations:
    CONCERNS:       [Report, Aircraft]
    IS_MODEL:       [Aircraft, AircraftModel]
    MADE_BY:        [AircraftModel, Manufacturer]
    REPORTED_BY:    [Report, Operator]
    CLASSIFIED_AS:  [Report, JascCode]
    INVOLVES_PART:  [Report, PartType]
    HAS_CONDITION:  [Report, Condition]
    REFERENCES:     [Report, AmmTask]

# ---------------------------------------------------------------------
# Entity resolution — manufacturers
# FAA codes are abbreviated. [D5] CNDAIR (Canadair) and BOMBDR
# (Bombardier): merge them? Default: no, keep both and document the link.
# ---------------------------------------------------------------------
manufacturers:
  AIRBUS: Airbus
  BOEING: Boeing
  EMB: Embraer
  CNDAIR: Canadair (Bombardier)
  BOMBDR: Bombardier
  DOUG: McDonnell Douglas
  CESSNA: Cessna
  DHAV: De Havilland
  SKRSKY: Sikorsky
  BOLKMS: Bolkow (MBB)
  AGUSTA: Agusta
  SNIAS: Aerospatiale (SNIAS)
  AEROSP: Aerospatiale
  BELL: Bell
  TEXTRN: Textron
  PIPER: Piper
  LEAR: Learjet
  SAAB: Saab
  LKHEED: Lockheed
  BEECH: Beechcraft
  RAYTHN: Raytheon
  FRCHLD: Fairchild
  SWRNGN: Swearingen
  AMD: Dassault (AMD)

# Aircraft families: the FAA model code (e.g. A320232, 737823) is
# mapped to a family by regular expression, in this order.
model_families:
  - {pattern: "^A3(\\d\\d)",      family: "A3{0}"}
  - {pattern: "^A2(\\d\\d)",      family: "A2{0}"}
  - {pattern: "^7(\\d7)",         family: "7{0}"}
  - {pattern: "^ERJ|^EMB|^ERJ1",  family: "ERJ"}
  - {pattern: "^CL",              family: "CRJ/Challenger"}

# Model hierarchy (D11): what people call a "family" is a group of models.
# "A320 family" = A318 + A319 + A320 + A321. Without this, a question about
# the A320 family only finds reports on the A320 itself.
model_groups:
  "A320 FAMILY": [A318, A319, A320, A321]
  "A330 FAMILY": [A330]
  "737 FAMILY": [737]
  "777 FAMILY": [777]

# ---------------------------------------------------------------------
# Entity resolution — part types [D2]
# Each canonical type has a list of aliases (regular expressions on the
# UPPER-CASE text). Order matters: specific types come before generic ones.
# label = French label, label_en = English label (used in outputs).
# [D4] ACMP (Boeing) and EMDP/ELEC PUMP: one "electric motor pump" type
# or two? Default: merged.
# ---------------------------------------------------------------------
part_types:
  ENGINE_DRIVEN_PUMP:
    label: "Pompe entraînée par le moteur (EDP)"
    label_en: "Engine-driven pump (EDP)"
    aliases:
      - "\\bEDPS?\\b"
      - "\\bENG(INE)?[ -]?DRIVEN (HYD(RAULIC)? )?PUMPS?\\b"
      - "\\bENG(INE)?\\s*(#|NO\\.?\\s*)?\\d?\\s*(HYD(RAULIC)? )?PUMPS?\\b"
  ELECTRIC_MOTOR_PUMP:
    label: "Pompe à moteur électrique (ACMP / EMDP)"
    label_en: "Electric motor pump (ACMP / EMDP)"
    aliases:
      - "\\bACMPS?\\b"
      - "\\bEMDPS?\\b"
      # Pitfall found: "ADD EMP:U349218" is an EMPloyee number, not a pump.
      # All 5 occurrences of EMP in scope were employees.
      - "\\bEMPS?\\b(?!:)"
      - "\\b(HYD(RAULIC)?\\.? )?ELEC(T|TRIC|TRICAL)?\\.?\\s*(MOTOR\\s*)?(DRIVEN\\s*)?(HYD(RAULIC)? )?PUMPS?\\b"
      - "\\bHYDRAULIC SYSTEM ELECTRIC PUMP\\b"
  POWER_TRANSFER_UNIT:
    label: "Power Transfer Unit (PTU)"
    label_en: "Power transfer unit (PTU)"
    aliases: ["\\bPTUS?\\b", "\\bPOWER TRANSFER UNITS?\\b"]
  RAM_AIR_TURBINE:
    label: "Ram Air Turbine (RAT)"
    label_en: "Ram air turbine (RAT)"
    aliases: ["\\bRAT\\b", "\\bRAM AIR TURBINE\\b"]
  HYDRAULIC_PUMP_UNSPECIFIED:
    label: "Pompe hydraulique (type non précisé)"
    label_en: "Hydraulic pump (type not specified)"
    aliases:
      - "\\bHYD(RAULIC|R)?\\.?\\s*(SYS(TEM)?\\s*)?([ABC]|GREEN|BLUE|YELLOW|L|R|LH|RH)?\\s*PUMPS?\\b"
      - "\\bHYDRAULICPUMP\\b"
      - "^PUMP$"
  RESERVOIR:
    label: "Réservoir hydraulique"
    label_en: "Hydraulic reservoir"
    aliases: ["\\bRESERVOIRS?\\b", "\\bRSVR\\b"]
  ACCUMULATOR:
    label: "Accumulateur"
    label_en: "Accumulator"
    aliases: ["\\bACCUM(ULATOR)?S?\\b"]
  PRESSURE_SWITCH:
    label: "Pressostat"
    label_en: "Pressure switch"
    aliases: ["\\bPRESS(URE)?\\.?\\s*SW(ITCH)?(ES)?\\b"]
  PRESSURE_TRANSMITTER:
    label: "Transmetteur / capteur de pression"
    label_en: "Pressure transmitter / transducer"
    aliases: ["\\b(PRESS(URE)?\\.?\\s*)?(TRANSMITTER|TRANSDUCER|XDCR|XMTR)S?\\b"]
  HYDRAULIC_LINE:
    label: "Tuyauterie (ligne, tube, flexible)"
    label_en: "Hydraulic line (tube, hose)"
    aliases:
      - "\\bHYD(RAULIC)?\\.?\\s*(PRESSURE |RETURN |SUPPLY |CASE DRAIN )?(LINE|TUBE|HOSE|PIPE)S?\\b"
      - "\\b(FLEX )?HOSES?\\b"
      - "\\bCASE DRAIN (LINE|HOSE|TUBE)S?\\b"
  FILTER:
    label: "Filtre"
    label_en: "Filter"
    aliases: ["\\bFILTERS?\\b"]
  CHECK_VALVE:
    label: "Clapet anti-retour"
    label_en: "Check valve"
    aliases: ["\\bCHECK VALVES?\\b"]
  SHUTOFF_VALVE:
    label: "Vanne de coupure (dont coupe-feu)"
    label_en: "Shutoff valve (incl. fire shutoff)"
    aliases: ["\\b(FIRE )?SHUT ?-?OFF VALVES?\\b", "\\bSOV\\b"]
  PRIORITY_VALVE:
    label: "Valve de priorité"
    label_en: "Priority valve"
    aliases: ["\\bPRIORITY VALVES?\\b"]
  MANIFOLD:
    label: "Bloc / collecteur hydraulique"
    label_en: "Manifold"
    aliases: ["\\bMANIFOLDS?\\b"]
  SEAL:
    label: "Joint (O-ring, packing)"
    label_en: "Seal (O-ring, packing)"
    aliases: ["\\bO-?RINGS?\\b", "\\bPACKINGS?\\b", "\\bSEALS?\\b"]
  FITTING:
    label: "Raccord (fitting, B-nut)"
    label_en: "Fitting (B-nut)"
    aliases: ["\\bFITTINGS?\\b", "\\bB-?NUTS?\\b"]
  HYDRAULIC_SYSTEM:
    label: "Système hydraulique (générique)"
    label_en: "Hydraulic system (generic)"
    aliases: ["^HYDRAULIC SYSTEM$"]

# PartName values that are not parts
part_name_ignore: ["WARNING MESSAGE", "NAN", "NONE", "UNKNOWN"]

# Maintenance manual references (AMM xx-xx-xx)
amm_pattern: "\\bAMM\\s*(?:TASK\\s*)?(\\d{2}-\\d{2}-\\d{2})"

# Test questions (for the GraphRAG step)
test_questions:
  - "What problems affect engine-driven pumps on the A320 family?"
  - "Which maintenance manual tasks are cited for electric motor pump leaks?"
  - "Which operators report the most PTU problems?"
